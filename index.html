<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore in 3D</title>
<meta name="theme-color" content="#F4F6F9">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #F4F6F9;
    --tile: #E9EDF3;
    --ink: #161B22;
    --muted: #5B6573;
    --accent: #2457F5;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; font-weight: 650; letter-spacing: -0.01em; }
  h1:focus { outline: none; }
  .hint { margin: 6px 0 16px; color: var(--muted); font-size: 1rem; }
  .desc { margin: 6px 0 0; font-size: 1rem; line-height: 1.4; }
  .msg { color: var(--muted); }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Grid */
  .grid {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 14px;
  }
  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px 18px; }
  }
  .tile { display: block; color: inherit; text-decoration: none; border-radius: 16px; }
  .thumb {
    aspect-ratio: 1; border-radius: 16px; background: var(--tile);
    overflow: hidden; display: grid; place-items: center;
    transition: transform .12s;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile:active .thumb { transform: scale(.97); }
  .name { display: block; margin: 10px 2px 0; font-size: 1rem; font-weight: 600; line-height: 1.3; }

  .btn, .back {
    font: inherit; font-weight: 550; color: var(--ink); background: none;
    border: 0; border-radius: 999px; cursor: pointer; min-height: 44px;
  }
  .btn { padding: 0 18px; background: var(--tile); }
  .back { display: inline-flex; align-items: center; gap: 4px; margin: 0 0 8px -8px; padding: 0 14px 0 8px; }
  .back:active { background: var(--tile); }

  /* Viewer */
  .stage {
    position: relative;
    height: 70vh;
    height: clamp(360px, 70dvh, 640px);
    border-radius: 20px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 30%, #FFFFFF 0%, #E6EBF2 100%);
  }
  .poster {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; transition: opacity .25s;
  }
  .poster.gone { opacity: 0; }
  model-viewer {
    position: relative; z-index: 1;
    width: 100%; height: 100%; background: transparent;
    --poster-color: transparent;
    --progress-bar-color: var(--accent);
    --progress-bar-height: 3px;
  }
  .error {
    position: absolute; inset: 0; z-index: 2;
    display: grid; place-items: center; padding: 24px; text-align: center;
    background: rgba(244, 246, 249, 0.92);
  }
  /* Style controls: solid white so they stay readable on every preset */
  .style-btn {
    position: absolute; right: 12px; bottom: 12px; z-index: 3;
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 16px 0 12px;
    font: inherit; font-weight: 550; color: var(--ink);
    background: #FFFFFF; border: 0; border-radius: 999px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 4px 14px rgba(0,0,0,.18);
  }
  dialog.sheet {
    width: 100%; max-width: 520px; max-height: 85dvh;
    margin: auto auto 0; padding: 0; border: 0;
    border-radius: 24px 24px 0 0; background: #FFFFFF; color: var(--ink);
  }
  dialog.sheet::backdrop { background: rgba(22, 27, 34, .45); }
  @media (min-width: 600px) { dialog.sheet { margin: auto; border-radius: 24px; } }
  .sheet-body { padding: 20px 20px max(20px, env(safe-area-inset-bottom)); }
  .sheet-body h2 { margin: 0 0 16px; font-size: 1.25rem; }
  .group-label { margin: 0 0 10px; color: var(--muted); font-size: .9375rem; }
  .swatches { display: flex; gap: 8px; margin-bottom: 20px; }
  .swatch {
    flex: 1; display: grid; justify-items: center; gap: 8px; padding: 6px 0;
    font: inherit; font-size: .9375rem; color: var(--ink);
    background: none; border: 0; border-radius: 14px; cursor: pointer;
  }
  .dot { width: 52px; height: 52px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); }
  .swatch[aria-pressed="true"] { font-weight: 650; }
  .swatch[aria-pressed="true"] .dot {
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.14), 0 0 0 3px #FFFFFF, 0 0 0 5px var(--accent);
  }
  .switch-row { display: flex; align-items: center; justify-content: space-between; min-height: 48px; margin-bottom: 16px; }
  .switch-row input {
    appearance: none; -webkit-appearance: none; position: relative;
    width: 52px; height: 32px; margin: 0; border-radius: 999px;
    background: #C5CCD8; cursor: pointer; transition: background .15s;
  }
  .switch-row input::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s;
  }
  .switch-row input:checked { background: var(--accent); }
  .switch-row input:checked::after { transform: translateX(20px); }
  .sheet-body .btn { width: 100%; background: var(--ink); color: #fff; }

  @media (prefers-reduced-motion: reduce) {
    .thumb, .poster, .switch-row input, .switch-row input::after { transition: none; }
  }
</style>
</head>
<body>
<main>
  <section id="list">
    <h1 tabindex="-1">Explore in 3D</h1>
    <p class="hint">Choose an object to view it in 3D.</p>
    <p id="listmsg" class="msg">Loading models…</p>
    <button id="retry" class="btn" type="button" hidden>Try again</button>
    <ul id="grid" class="grid"></ul>
  </section>

  <section id="viewerview" hidden>
    <button id="back" class="back" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      All models
    </button>
    <h1 id="mtitle" tabindex="-1"></h1>
    <p id="mdesc" class="desc" hidden></p>
    <p class="hint">Drag to rotate. Pinch to zoom.</p>
    <div class="stage">
      <img id="poster" class="poster" alt="">
      <model-viewer
        loading="eager"
        camera-controls
        touch-action="pan-y"
        environment-image="neutral"
        shadow-intensity="1">
      </model-viewer>
      <div class="error" id="error" role="alert" hidden>
        The 3D model couldn't be loaded. Check your connection and reload the page.
      </div>
      <button id="style-btn" class="style-btn" type="button" aria-haspopup="dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        Style
      </button>
    </div>

    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
      <div class="sheet-body">
        <h2 id="sheet-title">Style</h2>
        <p class="group-label" id="bg-label">Background</p>
        <div class="swatches" id="swatches" role="group" aria-labelledby="bg-label"></div>
        <label class="switch-row">
          <span>Auto-rotate</span>
          <input type="checkbox" id="rotate" role="switch">
        </label>
        <button id="sheet-close" class="btn" type="button">Done</button>
      </div>
    </dialog>
  </section>

  <section id="notfound" hidden>
    <h1 tabindex="-1">Model not found</h1>
    <p class="msg">This link doesn't match any model. <a href="#/">See all models</a></p>
  </section>
</main>

<script>
  const BASE = 'public/3d/';
  const $ = (s) => document.querySelector(s);
  const listView = $('#list'), viewerView = $('#viewerview'), notFoundView = $('#notfound');
  const grid = $('#grid'), listMsg = $('#listmsg'), retry = $('#retry');
  const mv = $('model-viewer'), poster = $('#poster'), errBox = $('#error');

  let models = [], ready = false, current = listView, listScroll = 0, cameFromList = false;

  const CUBE = '<svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="#9AA5B5" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M24 6 8 14v20l16 8 16-8V14L24 6Z"/><path d="m8 14 16 8 16-8M24 22v20"/></svg>';

  const urls = (m) => ({
    glb: BASE + (m.file || m.id + '.glb'),
    thumb: BASE + (m.thumb || 'thumbs/' + m.id + '.webp'),
  });

  /* Style presets: change the viewer stage only, never the rest of the page */
  const PRESETS = {
    studio: { label: 'Studio', swatch: '#E6EBF2', exposure: 1,    shadow: 1,
              bg: 'radial-gradient(120% 90% at 50% 30%, #FFFFFF 0%, #E6EBF2 100%)' },
    white:  { label: 'White',  swatch: '#FFFFFF', exposure: 1.05, shadow: 0.8,
              bg: '#FFFFFF' },
    stone:  { label: 'Stone',  swatch: '#DDD9D2', exposure: 1.05, shadow: 1,
              bg: 'radial-gradient(120% 90% at 50% 30%, #EFEDE9 0%, #D9D5CE 100%)' },
    night:  { label: 'Night',  swatch: '#1B2029', exposure: 1.25, shadow: 0.5,
              bg: 'radial-gradient(120% 90% at 50% 30%, #2A3140 0%, #12151B 100%)' },
  };
  const STORE = 'viewer-style';
  const stage = $('.stage'), sheet = $('#sheet'), rotate = $('#rotate'), swatches = $('#swatches');
  const prefs = { preset: 'studio', rotate: !matchMedia('(prefers-reduced-motion: reduce)').matches };

  try { // storage can be empty or blocked (private mode), so fall back silently
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s && PRESETS[s.preset]) prefs.preset = s.preset;
    if (s && typeof s.rotate === 'boolean') prefs.rotate = s.rotate;
  } catch (e) {}

  function savePrefs() {
    try { localStorage.setItem(STORE, JSON.stringify(prefs)); } catch (e) {}
  }

  function applyPrefs() {
    const p = PRESETS[prefs.preset];
    stage.style.background = p.bg;
    // attributes, not properties: safe even if model-viewer hasn't finished loading
    mv.setAttribute('exposure', p.exposure);
    mv.setAttribute('shadow-intensity', p.shadow);
    mv.toggleAttribute('auto-rotate', prefs.rotate);
    rotate.checked = prefs.rotate;
    swatches.querySelectorAll('button').forEach((b) =>
      b.setAttribute('aria-pressed', String(b.dataset.preset === prefs.preset)));
  }

  Object.entries(PRESETS).forEach(([key, p]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch';
    b.dataset.preset = key;
    b.innerHTML = '<span class="dot"></span><span class="lbl"></span>';
    b.querySelector('.dot').style.background = p.swatch;
    b.querySelector('.lbl').textContent = p.label;
    b.addEventListener('click', () => { prefs.preset = key; applyPrefs(); savePrefs(); });
    swatches.append(b);
  });

  rotate.addEventListener('change', () => { prefs.rotate = rotate.checked; applyPrefs(); savePrefs(); });
  $('#style-btn').addEventListener('click', () => sheet.showModal());
  $('#sheet-close').addEventListener('click', () => sheet.close());
  sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.close(); }); // backdrop tap
  applyPrefs();

  function setView(v) {
    [listView, viewerView, notFoundView].forEach((x) => { x.hidden = x !== v; });
    current = v;
    v.querySelector('h1').focus({ preventScroll: true });
  }

  function renderGrid() {
    grid.replaceChildren(...models.map((m) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = '#/' + encodeURIComponent(m.id);
      a.addEventListener('click', () => { cameFromList = true; });

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const img = new Image();
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.addEventListener('error', () => { thumb.innerHTML = CUBE; });
      img.src = urls(m).thumb;
      thumb.append(img);

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = m.title || m.id;

      a.append(thumb, name);
      li.append(a);
      return li;
    }));
  }

  function leaveViewer() {
    mv.removeAttribute('src'); // frees the model's memory on phones
    errBox.hidden = true;
    if (sheet.open) sheet.close();
  }

  function showList() {
    leaveViewer();
    cameFromList = false;
    document.title = 'Explore in 3D';
    setView(listView);
    scrollTo(0, listScroll);
  }

  function showViewer(m) {
    if (current === listView) listScroll = scrollY;
    const u = urls(m);
    const title = m.title || m.id;
    errBox.hidden = true;
    poster.hidden = false;
    poster.classList.remove('gone');
    poster.src = u.thumb;
    mv.setAttribute('alt', '3D model of ' + title);
    mv.setAttribute('src', u.glb);
    $('#mtitle').textContent = title;
    const desc = $('#mdesc');
    desc.textContent = m.description || '';
    desc.hidden = !m.description;
    document.title = title + ' | Explore in 3D';
    setView(viewerView);
    scrollTo(0, 0);
  }

  function showNotFound() {
    if (current === listView) listScroll = scrollY;
    leaveViewer();
    document.title = 'Not found | Explore in 3D';
    setView(notFoundView);
    scrollTo(0, 0);
  }

  function route() {
    let id = '';
    try { id = decodeURIComponent(location.hash.replace(/^#\/?/, '')); } catch (e) {}
    if (!id) return showList();
    const m = models.find((x) => x.id === id);
    m ? showViewer(m) : showNotFound();
  }

  mv.addEventListener('load', () => poster.classList.add('gone'));
  mv.addEventListener('error', (e) => {
    console.error('Model failed to load:', e.detail);
    errBox.hidden = false;
  });
  poster.addEventListener('error', () => { poster.hidden = true; });

  $('#back').addEventListener('click', () => {
    if (cameFromList) history.back();
    else location.hash = '#/';
  });
  addEventListener('hashchange', () => { if (ready) route(); });
  retry.addEventListener('click', init);

  async function init() {
    listMsg.hidden = false;
    listMsg.textContent = 'Loading models…';
    retry.hidden = true;
    try {
      const r = await fetch(BASE + 'models.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const seen = new Set();
      models = (await r.json()).filter((m) => m && m.id && !seen.has(m.id) && seen.add(m.id));
    } catch (e) {
      console.error('models.json failed:', e);
      listMsg.textContent = "The model list couldn't be loaded. Check your connection and try again.";
      retry.hidden = false;
      return;
    }
    renderGrid();
    listMsg.hidden = models.length > 0;
    if (!models.length) listMsg.textContent = 'No models yet.';
    ready = true;
    route();
  }

  init();
</script>
</body>
</html>
