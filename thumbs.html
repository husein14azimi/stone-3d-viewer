<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thumbnail maker</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg: #F4F6F9; --tile: #E9EDF3; --ink: #161B22; --muted: #5B6573; --accent: #2457F5; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 1.5rem; }
  p { color: var(--muted); line-height: 1.45; margin: 6px 0 14px; }
  code { background: var(--tile); padding: 1px 5px; border-radius: 5px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  button { font: inherit; font-weight: 550; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button.alt { background: var(--tile); color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); }
  model-viewer { width: min(100%, 360px); aspect-ratio: 1; border-radius: 16px;
                 background: radial-gradient(120% 90% at 50% 30%, #fff 0%, #E6EBF2 100%); }
  ul { list-style: none; padding: 0; margin: 20px 0 0; display: grid;
       grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  li img { width: 100%; aspect-ratio: 1; border-radius: 14px; background: var(--tile); display: block; }
  li .n { display: block; margin: 8px 0 2px; font-weight: 600; word-break: break-all; }
  li .bad { color: #B3261E; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Thumbnail maker</h1>
  <p>Captures a 512&times;512 WebP of every model listed in <code>public/3d/models.json</code>.
     Save the files into <code>public/3d/thumbs/</code>, keeping the names (<code>id.webp</code>).</p>

  <div class="row">
    <button id="go" type="button">Capture all</button>
    <button id="dl" class="alt" type="button" disabled>Download all</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>

  <model-viewer id="mv" loading="eager" environment-image="neutral" shadow-intensity="1" alt="Preview"></model-viewer>
  <ul id="out"></ul>
</main>

<script>
  const BASE = 'public/3d/', SIZE = 512;
  const $ = (s) => document.querySelector(s);
  const mv = $('#mv'), go = $('#go'), dl = $('#dl'), out = $('#out'), status = $('#status');
  const results = [];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function loaded() {
    return new Promise((resolve, reject) => {
      const ok = () => { off(); resolve(); };
      const bad = () => { off(); reject(new Error('load failed')); };
      const off = () => { mv.removeEventListener('load', ok); mv.removeEventListener('error', bad); };
      mv.addEventListener('load', ok);
      mv.addEventListener('error', bad);
    });
  }

  async function capture(m) {
    const done = loaded();
    mv.src = BASE + (m.file || m.id + '.glb');
    await done;
    await mv.updateComplete;
    await wait(500); // let lighting and shadow settle
    const raw = await mv.toBlob({ mimeType: 'image/png' });
    const bmp = await createImageBitmap(raw);
    const c = document.createElement('canvas');
    c.width = c.height = SIZE;
    c.getContext('2d').drawImage(bmp, 0, 0, SIZE, SIZE);
    return new Promise((r) => c.toBlob(r, 'image/webp', 0.85));
  }

  function addResult(m, blob, error) {
    const li = document.createElement('li');
    const name = document.createElement('span');
    name.className = 'n';
    name.textContent = m.id + '.webp';
    if (blob) {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.alt = m.title || m.id;
      img.src = url;
      const a = document.createElement('a');
      a.href = url;
      a.download = m.id + '.webp';
      a.textContent = 'Download';
      li.append(img, name, a);
      results.push({ url, file: m.id + '.webp' });
    } else {
      const msg = document.createElement('span');
      msg.className = 'bad';
      msg.textContent = "Couldn't load " + (m.file || m.id + '.glb') + '.';
      li.append(name, msg);
    }
    out.append(li);
  }

  go.addEventListener('click', async () => {
    go.disabled = dl.disabled = true;
    out.replaceChildren();
    results.length = 0;
    let models;
    try {
      const r = await fetch(BASE + 'models.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      models = await r.json();
    } catch (e) {
      status.textContent = "Couldn't read models.json. Run this page from your site, not from disk.";
      go.disabled = false;
      return;
    }
    for (let i = 0; i < models.length; i++) {
      status.textContent = 'Capturing ' + (i + 1) + ' of ' + models.length + '…';
      try { addResult(models[i], await capture(models[i])); }
      catch (e) { console.error(e); addResult(models[i], null, e); }
    }
    status.textContent = 'Done. ' + results.length + ' of ' + models.length + ' captured.';
    go.disabled = false;
    dl.disabled = results.length === 0;
  });

  dl.addEventListener('click', async () => {
    for (const r of results) {
      const a = document.createElement('a');
      a.href = r.url;
      a.download = r.file;
      a.click();
      await wait(300);
    }
  });
</script>
</body>
</html>
